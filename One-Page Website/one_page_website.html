
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One-Page Website - Photo Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        header {
            background-color: #263238;
            color: white;
            padding: 30px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
        }

        .gallery-column {
            width: 25%;
            padding: 8px;
            box-sizing: border-box;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }

        .gallery img:hover {
            opacity: 0.7;
        }

        #lightbox {
            display: none;
            position: fixed;
            z-index: 10;
            padding-top: 60px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
        }

        #lightbox-image {
            display: block;
            max-width: 85%;
            max-height: 75vh;
            margin: auto;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }

        .previous, .next {
            position: absolute;
            top: 50%;
            color: white;
            font-size: 40px;
            cursor: pointer;
            padding: 15px;
        }

        .previous { left: 10px; }
        .next { right: 10px; }

        @media screen and (max-width: 700px) {
            .gallery-column { width: 50%; }
        }

        @media screen and (max-width: 450px) {
            .gallery-column { width: 100%; }
        }
    </style>
</head>

<body>

    <header>
        <h1>My One-Page Website</h1>
        <p>Welcome to my photo gallery</p>
    </header>

    <h2>My Image Gallery</h2>
    <p>Click any image to view it in the lightbox.</p>

    <div class="gallery">
        <div class="gallery-column">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=400"
                 data-full="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1400"
                 alt="Mountain landscape" onclick="openLightbox(0)">
        </div>

        <div class="gallery-column">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=400"
                 data-full="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1400"
                 alt="Beautiful nature" onclick="openLightbox(1)">
        </div>

        <div class="gallery-column">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=400"
                 data-full="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=1400"
                 alt="Sunrise landscape" onclick="openLightbox(2)">
        </div>

        <div class="gallery-column">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=400"
                 data-full="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1400"
                 alt="Forest landscape" onclick="openLightbox(3)">
        </div>
    </div>

    <div id="lightbox">
        <span class="close" onclick="closeLightbox()">&times;</span>
        <span class="previous" onclick="changeImage(-1)">&#10094;</span>
        <img id="lightbox-image" alt="Enlarged gallery image">
        <span class="next" onclick="changeImage(1)">&#10095;</span>
    </div>

    <script src="JS/one_page_website.js"></script>

</body>
</html>
